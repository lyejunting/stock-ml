
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AAPL Walk-Forward Prediction Demo
    </title>

    <script
        src="https://cdn.plot.ly/plotly-2.35.2.min.js">
    </script>

    <style>z
        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            margin: 32px;
            background: #f7f7f7;
        }

        h1 {
            margin-bottom: 6px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        button,
        select {
            min-height: 42px;
            padding: 8px 16px;
            font-size: 14px;
        }

        button {
            cursor: pointer;
        }

        .status {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow:
                0 1px 4px
                rgba(0, 0, 0, 0.12);
        }

        .label {
            font-size: 12px;
            color: #777;
            margin-bottom: 4px;
        }

        .value {
            font-size: 21px;
            font-weight: 600;
        }

        #chart {
            background: white;
            border-radius: 8px;
        }

        .correct {
            color: #188038;
        }

        .wrong {
            color: #d93025;
        }
    </style>
</head>

<body>

    <h1>
        AAPL XGBoost Walk-Forward Prediction
    </h1>

    <div class="subtitle">
        The model predicts whether AAPL will rise on the
        next trading day. Every displayed prediction is
        out-of-sample.
    </div>

    <div class="controls">

        <button id="playBtn" type="button">
            ▶ Play
        </button>

        <button id="pauseBtn" type="button">
            ⏸ Pause
        </button>

        <button id="resetBtn" type="button">
            ↺ Reset
        </button>

        <label>
            Speed:

            <select id="speedSelect">
                <option value="500">
                    1×
                </option>

                <option value="100">
                    5×
                </option>

                <option value="25">
                    20×
                </option>
            </select>
        </label>

    </div>

    <div class="status">

        <div class="card">
            <div class="label">
                Date
            </div>
            <div
                id="dateValue"
                class="value">
                -
            </div>
        </div>

        <div class="card">
            <div class="label">
                AAPL Price
            </div>
            <div
                id="priceValue"
                class="value">
                -
            </div>
        </div>

        <div class="card">
            <div class="label">
                Probability Up
            </div>
            <div
                id="probabilityValue"
                class="value">
                -
            </div>
        </div>

        <div class="card">
            <div class="label">
                Prediction
            </div>
            <div
                id="predictionValue"
                class="value">
                -
            </div>
        </div>

        <div class="card">
            <div class="label">
                Actual Next Day
            </div>
            <div
                id="actualValue"
                class="value">
                -
            </div>
        </div>

        <div class="card">
            <div class="label">
                Result
            </div>
            <div
                id="resultValue"
                class="value">
                -
            </div>
        </div>

        <div class="card">
            <div class="label">
                Running Accuracy
            </div>
            <div
                id="accuracyValue"
                class="value">
                -
            </div>
        </div>

    </div>

    <div id="chart"></div>

            [

            layout,
            {
                responsive: true,
                displaylogo: false
            }
        );

        function updateStatus(point) {

            document.getElementById(
                "dateValue"
            ).innerText = point.date;

            document.getElementById(
                "priceValue"
            ).innerText =
                "$" + point.price.toFixed(2);

            document.getElementById(
                "probabilityValue"
            ).innerText =
                point.probability_up.toFixed(1) + "%";

            document.getElementById(
                "predictionValue"
            ).innerText =
                point.prediction;

            document.getElementById(
                "actualValue"
            ).innerText =
                point.actual;

            const resultElement =
                document.getElementById(
                    "resultValue"
                );

            if (point.correct) {
                resultElement.innerText =
                    "Correct ✓";

                resultElement.className =
                    "value correct";
            } else {
                resultElement.innerText =
                    "Wrong ✕";

                resultElement.className =
                    "value wrong";
            }

            document.getElementById(
                "accuracyValue"
            ).innerText =
                point.running_accuracy.toFixed(1)
                + "%";
        }


        function renderPoint(index) {

            if (index >= data.length) {
                pause();
                return;
            }

            const point = data[index];

            Plotly.extendTraces(
                "chart",
                {
                    x: [
                        [point.date],
                        [point.date],
                        [point.date]
                    ],
                    y: [
                        [point.price],
                        [point.probability_up],
                        [50]
                    ]
                },
                [0, 1, 2]
            );

            updateStatus(point);

            currentIndex += 1;
        }


        function scheduleNextPoint() {

            if (currentIndex >= data.length) {
                pause();
                return;
            }

            const speed = Number(
                document.getElementById(
                    "speedSelect"
                ).value
            );

            timer = setTimeout(
                function () {
                    timer = null;
                    renderPoint(currentIndex);
                    scheduleNextPoint();
                },
                speed
            );
        }


        function play() {

            if (timer !== null) {
                return;
            }

            if (currentIndex >= data.length) {
                resetPlot();
            }

            if (currentIndex === 0) {
                renderPoint(currentIndex);
            }

            scheduleNextPoint();
        }


        function pause() {

            if (timer !== null) {
                clearTimeout(timer);
                timer = null;
            }
        }


        function resetPlot() {

            pause();

            currentIndex = 0;

            Plotly.react(
                "chart",
                [
                    {
                        ...priceTrace,
                        x: [],
                        y: []
                    },
                    {
                        ...probabilityTrace,
                        x: [],
                        y: []
                    },
                    {

                        x: [],
                        y: []
                    }
                ],
                layout,

                }
            );

                );

            resultElement.className = "value";

            document.getElementById(
                "accuracyValue"
            ).innerText = "-";
        }
